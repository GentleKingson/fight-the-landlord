# Pre-commit hooks configuration
# Install: pre-commit install && pre-commit install --hook-type pre-push
# Run manually: pre-commit run --all-files
default_stages: [pre-commit]

repos:
  # General file checks (fast, run on commit)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
        args: ["--unsafe"] # Allow custom tags
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  # Tools are installed by .agents/setup; golangci-lint v2.11.1 matches CI.
  - repo: local
    hooks:
      - id: goimports
        name: Format Go imports
        entry: goimports -w -local github.com/palemoky/fight-the-landlord
        language: system
        types: [go]
        exclude: '(internal/protocol/pb/.*\.pb\.go|internal/protocol/convert/msgtype/mapping\.go)$'

      - id: gofumpt
        name: Format Go code
        entry: gofumpt -w
        language: system
        types: [go]
        exclude: '(internal/protocol/pb/.*\.pb\.go|internal/protocol/convert/msgtype/mapping\.go)$'

      - id: web-prettier
        name: Check changed web file formatting
        entry: web/node_modules/.bin/prettier --check
        language: system
        files: '^web/.*\.(ts|tsx|json|css)$'
        exclude: '(proto\.generated\.ts|package-lock\.json)$'

      - id: python-ruff
        name: Check changed inference Python files
        entry: uv run --project douzero --locked --only-group dev ruff check
        language: system
        files: '^douzero/.*\.py$'
        exclude: '^douzero/vendor/'

      - id: go-check-fast
        name: Go build, vet, and incremental lint
        entry: make check-fast-go
        language: system
        files: '(\.go$|^go\.(mod|sum)$|^\.golangci\.yml$|^Makefile$)'
        pass_filenames: false

      - id: web-typecheck
        name: Typecheck Web source and tooling
        entry: make check-fast-web
        language: system
        files: '^web/.*\.(ts|tsx|json)$|^Makefile$'
        pass_filenames: false

      - id: python-check-fast
        name: Check inference Python configuration
        entry: make check-fast-python
        language: system
        files: '^douzero/(pyproject\.toml|uv\.lock)$|^Makefile$'
        pass_filenames: false

      - id: protocol-sync
        name: Check generated Go and TS protocol files
        entry: make check-proto-changed
        language: system
        # pre-commit omits deleted files; the script handles path filtering itself.
        always_run: true
        pass_filenames: false

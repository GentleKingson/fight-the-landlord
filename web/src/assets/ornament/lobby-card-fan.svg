<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#efe5cf"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b3302f"/>
      <stop offset="1" stop-color="#6c1219"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#c98a2b"/>
    </linearGradient>
    <pattern id="lattice" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0h12v12H0z" fill="none" stroke="#f1c46a" stroke-opacity=".35" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#04140d" flood-opacity=".5"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- card back -->
    <g transform="translate(52 44) rotate(-26 60 170)">
      <rect width="120" height="170" rx="12" fill="url(#back)" stroke="url(#gold)" stroke-width="4"/>
      <rect x="10" y="10" width="100" height="150" rx="7" fill="url(#lattice)" stroke="#f1c46a" stroke-opacity=".7" stroke-width="1.5"/>
      <circle cx="60" cy="85" r="24" fill="#7a151c" stroke="url(#gold)" stroke-width="3"/>
      <text x="60" y="95" text-anchor="middle" font-family="'Noto Serif CJK SC','Songti SC',serif" font-size="28" font-weight="900" fill="url(#gold)">斗</text>
    </g>
    <!-- K hearts -->
    <g transform="translate(100 30) rotate(-6 60 170)">
      <rect width="120" height="170" rx="12" fill="url(#face)" stroke="#c9a65b" stroke-width="2"/>
      <rect x="7" y="7" width="106" height="156" rx="8" fill="none" stroke="#c9a65b" stroke-opacity=".55"/>
      <text x="14" y="36" font-family="Georgia,serif" font-size="30" font-weight="900" fill="#c8352e">K</text>
      <text x="16" y="58" font-family="Georgia,serif" font-size="20" fill="#c8352e">♥</text>
      <text x="60" y="118" text-anchor="middle" font-family="Georgia,serif" font-size="64" fill="#c8352e">♥</text>
    </g>
    <!-- A spades -->
    <g transform="translate(130 28) rotate(12 60 170)">
      <rect width="120" height="170" rx="12" fill="url(#face)" stroke="#c9a65b" stroke-width="2"/>
      <rect x="7" y="7" width="106" height="156" rx="8" fill="none" stroke="#c9a65b" stroke-opacity=".55"/>
      <text x="14" y="36" font-family="Georgia,serif" font-size="30" font-weight="900" fill="#1c2630">A</text>
      <text x="16" y="58" font-family="Georgia,serif" font-size="20" fill="#1c2630">♠</text>
      <text x="60" y="122" text-anchor="middle" font-family="Georgia,serif" font-size="74" fill="#1c2630">♠</text>
      <text x="106" y="150" text-anchor="middle" font-family="Georgia,serif" font-size="30" font-weight="900" fill="#1c2630" transform="rotate(180 100 140)">A</text>
    </g>
  </g>
</svg>

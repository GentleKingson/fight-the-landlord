[project]
name = "douzero-inference"
version = "0.1.0"
description = "MARVEL CPU inference service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.2,<3",
    "torch>=2.6,<3",
    "pybind11>=3.0,<4",
    "tyro>=1.0,<2",
    "tqdm>=4.67,<5",
]

[dependency-groups]
dev = ["ruff>=0.15,<0.16"]
build = ["setuptools>=64", "wheel", "cmake>=3.26"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
extend-exclude = ["vendor", "models"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B006", "B012", "B015", "B018", "B023"]

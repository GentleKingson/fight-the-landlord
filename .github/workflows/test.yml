name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: web
      - name: Keep browser test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-browser-results
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7
  inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: python -m unittest discover -s douzero/tests -v
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep in sync with .pre-commit-config.yaml.
      GOLANGCI_LINT_VERSION: v2.11.1
      # Cold installs use the Go module proxy, not GitHub Release assets.
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@v7
      - name: Test CI tool installation
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Set up Go
        id: go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Restore lint executable
        id: lint-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ci-tools/golangci-lint
          # Exact match only: never restore a different tool or compiler version.
          key: lint-bin-v1-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('scripts/install-ci-lint.sh') }}
      - name: Install and verify lint executable
        run: bash scripts/install-ci-lint.sh "$GOLANGCI_LINT_VERSION" "$HOME/.cache/ci-tools/golangci-lint"
      - name: Save verified lint executable
        if: steps.lint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ci-tools/golangci-lint
          key: ${{ steps.lint-cache.outputs.cache-primary-key }}
      - name: Run golangci-lint
        run: make lint

  go-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Run tests
        # Use ci tag to skip sound tests/deps
        run: go test -tags=ci -race -p 4 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Save Go cache
        uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

  # Preserve the existing required check name. A failed/skipped/cancelled
  # dependency must never turn into a green aggregate check.
  test:
    if: ${{ always() }}
    needs: [lint, go-test]
    runs-on: ubuntu-latest
    steps:
      - name: Require lint and Go tests
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.go-test.result }}
        run: |
          printf 'lint=%s, go-test=%s\n' "$LINT_RESULT" "$TEST_RESULT"
          [[ "$LINT_RESULT" == success && "$TEST_RESULT" == success ]]

# Correctness checks; formatting lives in the file-scoped hooks.
version: "2"

run:
  timeout: 5m
  tests: true # Preserve test-only references for unused; analysis never executes tests.

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - errorlint
    - nilerr
    - bodyclose
    - sqlclosecheck
    - gosec
  settings:
    govet:
      enable-all: true
      disable:
        - shadow
        - fieldalignment
    gosec:
      excludes:
        - G404 # Game shuffling uses non-cryptographic randomness.
        - G117 # Internal configuration field names match secret patterns.
        - G704 # URLs come from trusted environment configuration.
        - G706 # Existing exemption for internally generated log parameters.
    errorlint:
      errorf: true
      asserts: true
      comparison: true
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - errcheck
    paths:
      - internal/protocol/pb
      - internal/protocol/convert/msgtype/mapping.go

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
